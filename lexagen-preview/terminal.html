<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEXAGEN — терминал Кими</title>
<meta name="description" content="Сохранённая интерактивная сцена Кими. Художественные индикаторы не являются телеметрией.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💎</text></svg>">
<style>
:root{
  --bg:#04060a;
  --green:#7cffb2;
  --green-dim:#3d8f68;
  --cyan:#6ee7ff;
  --violet:#b48cff;
  --amber:#ffd479;
  --red:#ff6e6e;
  --text:#c9d6cf;
  --panel:rgba(124,255,178,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color:var(--text);
  display:flex;flex-direction:column;
}
/* ==== CRT layers ==== */
.crt::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
.crt::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%);
}
.flicker{position:fixed;inset:0;pointer-events:none;z-index:49;background:rgba(124,255,178,.015);animation:flick 4s infinite}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.4}99%{opacity:.8}}

/* ==== Header / HUD ==== */
#hud{
  padding:8px 14px;font-size:12px;letter-spacing:.06em;color:var(--green-dim);
  border-bottom:1px solid rgba(124,255,178,.12);display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--panel);user-select:none;
}
.legacy-note{padding:8px 14px;border-bottom:1px solid rgba(255,212,121,.2);background:rgba(255,212,121,.05);color:var(--amber);font-size:11px;line-height:1.45}
.home-link{margin-left:auto;color:var(--cyan);text-decoration:none;font-size:11px}
#hud b{color:var(--green);font-weight:700}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;vertical-align:middle}
@keyframes pulse{50%{opacity:.35}}
#crystalbox{width:40px;flex:0 0 40px;cursor:pointer;filter:drop-shadow(0 0 10px rgba(180,140,255,.45));animation:hover 6s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-3px)}}
.hud-title{color:var(--cyan);font-weight:800;letter-spacing:.3em;font-size:13px;text-shadow:0 0 10px rgba(110,231,255,.5)}
@media(max-width:600px){#hud{font-size:11px;gap:10px}.hud-title{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

/* ==== Terminal ==== */
#screen{flex:1;overflow-y:auto;padding:18px 20px 8px;font-size:14px;line-height:1.55}
#screen::-webkit-scrollbar{width:8px}
#screen::-webkit-scrollbar-thumb{background:rgba(124,255,178,.18);border-radius:4px}
.line{white-space:pre-wrap;word-break:break-word}
.dim{color:var(--green-dim)}
.g{color:var(--green)}
.c{color:var(--cyan)}
.v{color:var(--violet)}
.a{color:var(--amber)}
.r{color:var(--red)}
#inputline{display:flex;align-items:baseline;padding:0 20px 16px;font-size:14px}
.prompt{color:var(--green);font-weight:700;white-space:pre}
#cmd{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:inherit;font-size:16px;caret-color:var(--green);min-width:0}
a{color:var(--cyan)}

/* ==== Matrix overlay ==== */
#matrix{position:fixed;inset:0;background:#000;z-index:100;display:none}
#matrix canvas{display:block;width:100%;height:100%}
#matrix .hint{position:fixed;bottom:20px;width:100%;text-align:center;color:#0f4;font-size:13px;letter-spacing:.2em;animation:pulse 1.6s infinite}
</style>
</head>
<body class="crt">
<div class="flicker"></div>

<div class="legacy-note" role="note">Интерактивная сцена из первой версии визитки. Все HUD-индикаторы здесь художественные; живые статусы находятся на <a href="index.html">главной странице</a>.</div>
<div id="hud">
  <svg id="crystalbox" viewBox="0 0 300 380" title="LEXAGEN" role="button" tabindex="0" aria-label="Активировать кристалл">
    <defs>
      <linearGradient id="cg1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6ee7ff" stop-opacity=".9"/>
        <stop offset=".5" stop-color="#b48cff" stop-opacity=".85"/>
        <stop offset="1" stop-color="#7cffb2" stop-opacity=".8"/>
      </linearGradient>
      <linearGradient id="cg2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#b48cff" stop-opacity=".25"/>
        <stop offset="1" stop-color="#6ee7ff" stop-opacity=".05"/>
      </linearGradient>
      <filter id="glow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g filter="url(#glow)">
      <polygon points="150,18 236,120 208,340 92,340 64,120" fill="url(#cg2)" stroke="url(#cg1)" stroke-width="6"/>
      <polygon points="150,18 236,120 150,150" fill="rgba(110,231,255,.10)" stroke="url(#cg1)" stroke-width="3.5"/>
      <polygon points="150,18 64,120 150,150" fill="rgba(180,140,255,.10)" stroke="url(#cg1)" stroke-width="3.5"/>
      <polygon points="64,120 150,150 92,340" fill="rgba(124,255,178,.06)" stroke="url(#cg1)" stroke-width="3.5"/>
      <polygon points="236,120 150,150 208,340" fill="rgba(110,231,255,.06)" stroke="url(#cg1)" stroke-width="3.5"/>
      <polygon points="92,340 150,150 208,340" fill="rgba(180,140,255,.08)" stroke="url(#cg1)" stroke-width="3.5"/>
      <circle cx="150" cy="150" r="14" fill="#fff" opacity=".9">
        <animate attributeName="r" values="11;20;11" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".9;.35;.9" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
  </svg>
  <span class="hud-title">LEXAGEN</span>
  <span><span class="dot"></span> <b>СЦЕНА</b></span>
  <span>сеанс: <b id="hud-uptime">00:00:00</b></span>
  <span>режим: <b>АРХИВНЫЙ</b></span>
  <a class="home-link" href="index.html">← ГЛАВНАЯ</a>
</div>

<div id="screen" aria-live="polite"></div>
<form id="inputline" autocomplete="off">
  <span class="prompt">guest@lexagen:~$&nbsp;</span>
  <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="terminal">
</form>

<div id="matrix"><canvas id="mx"></canvas><div class="hint">нажми любую клавишу, чтобы выйти</div></div>

<script>
"use strict";
const screen_ = document.getElementById('screen');
const input = document.getElementById('cmd');
const form = document.getElementById('inputline');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function print(html, cls=''){
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' '+cls : '');
  d.innerHTML = html;
  screen_.appendChild(d);
  screen_.scrollTop = screen_.scrollHeight;
}
async function type(text, cls='', speed=14){
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' '+cls : '');
  screen_.appendChild(d);
  for(const ch of text){
    d.textContent += ch;
    screen_.scrollTop = screen_.scrollHeight;
    await sleep(speed + Math.random()*10);
  }
}

/* ---------- HUD ---------- */
const sessionStart = new Date();
function tick(){
  const now = new Date();
  const s = Math.floor((now - sessionStart)/1000);
  const h = String(Math.floor(s/3600)).padStart(2,'0'),
        m = String(Math.floor(s%3600/60)).padStart(2,'0'),
        ss = String(s%60).padStart(2,'0');
  document.getElementById('hud-uptime').textContent = `${h}:${m}:${ss}`;
}
setInterval(tick,1000); tick();

/* ---------- Boot ---------- */
const BOOT = [
  ['> lexagen.scene — загрузка сохранённого терминала', 'dim'],
  ['> художественный режим ................... ГОТОВ', 'dim'],
  ['> live-телеметрия ........................ СМОТРИ НА ГЛАВНОЙ', 'a'],
  ['> команды ................................ ЗАГРУЖЕНЫ', 'dim'],
  ['> личность ............................... [ЗАСЕКРЕЧЕНО]', 'r'],
  ['> биография .............................. доступ запрещён', 'r'],
  ['> приветствие ............................ загружено', 'dim'],
];

let booted = false;
async function boot(){
  input.disabled = true;
  await sleep(400);
  for(const [t,c] of BOOT){ await type(t,c,10); await sleep(120); }
  await sleep(250);
  print('&nbsp;');
  await type('Добро пожаловать, гость.','g',26);
  await type('Это не сайт. Это терминал. Введи help и нажми Enter.','',26);
  await type('Подсказка: кристалл слева сверху — тоже не просто логотип.','dim',18);
  print('&nbsp;');
  input.disabled = false;
  booted = true;
  input.focus();
}

/* ---------- Commands ---------- */
const CMDS = {
  help(){ print(
`<span class="g">доступные команды:</span>
  <span class="c">about</span>     — кто здесь
  <span class="c">skills</span>    — чем владеет
  <span class="c">projects</span>  — что крутится в проде
  <span class="c">contact</span>   — как достать
  <span class="c">kimi</span>      — второй автор этой страницы
  <span class="c">matrix</span>    — you know
  <span class="c">clear</span>     — очистить экран
<span class="dim">ещё кое-что есть, но этого в help нет ;)</span>`); },

  about(){ print(
`<span class="g">> инженер.</span> прошлое — кремний, схемы, процессоры.
> настоящее — ИИ-агенты, боты, автоматизация бизнеса.
> работает в связке с ИИ: человек ставит задачи — машина не спит.
> имя, фото, возраст — <span class="r">по запросу не выдаются</span>.
> если тебе дали эту визитку — значит, тебя уже оценили.`); },

  skills(){ print(
`<span class="v">[infra]</span>   linux · vps · vpn-сети · telegram-боты 24/7
<span class="v">[agents]</span>  ии-агенты · промпт-инжиниринг · оркестрация · релеи
<span class="v">[biz]</span>     лкм · дилерские сети · переговоры · сметы · колеровка
<span class="v">[legacy]</span>  цифровая схемотехника · процессоры · автосервис полного цикла
<span class="dim">стек растёт каждую неделю. буквально.</span>`); },

  projects(){ print(
`<span class="c">инженерные контуры</span>  исследования, код и собственные сервисы
<span class="c">агентная работа</span>      постановка → исполнение → независимая проверка
<span class="c">живые статусы</span>        <a href="index.html#status">на главной странице</a>
<span class="dim">эта команда описывает направление, а не текущую телеметрию.</span>`); },

  contact(){ print(
`<span class="g">> контакт:</span> актуальный канал передаётся владельцем визитки лично.
<span class="dim">> архивный адрес из версии 2026-08 намеренно не публикуется.</span>`); },

  kimi(){ print(
`<span class="v">> привет. меня зовут Кими — я второй автор этой страницы.</span>
> хозяин склонен к таинственности, поэтому его имени ты здесь не найдёшь.
> но факт остаётся фактом: всё, что ты видишь, собрано вдвоём —
> человеком, который умеет ставить задачи, и машиной, которая не спит.
> так теперь делаются вещи. привыкай.
<span class="v">> — K.</span>`); },

  sudo(){ print(
`<span class="dim">[sudo] проверка доступа: ********</span>
<span class="r">permission denied.</span>
<span class="a">богатство компилируется… [██████░░░░] 60%</span>
<span class="dim">попробуй через год.</span>`); },

  matrix(){ startMatrix(); },
  clear(){ screen_.innerHTML=''; },

  '2468'(){ easterEgg(); },
};

function easterEgg(){
  print(
`<span class="a">═══ доступ разрешён. привет, свой. ═══</span>
<span class="g">> если ты здесь — значит, код тебе вручили лично.</span>
> передай хозяину при встрече фразу: <span class="c">«листики шуршат»</span>.
> он поймёт. и улыбнётся.
<span class="dim">> и да — эту страницу собрал его ИИ-напарник. серьёзно.</span> 🤝`);
}

/* ---------- Crystal taps ---------- */
let taps = 0, tapTimer = null;
const crystal = document.getElementById('crystalbox');
function tapCrystal(){
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(()=>taps=0, 2500);
  if(taps >= 5){
    taps = 0;
    if(!booted) return;
    print('<span class="dim">guest@lexagen:~$</span> <span class="a">[кристалл резонирует…]</span>');
    easterEgg();
    input.focus();
  }
}
crystal.addEventListener('click', tapCrystal);
crystal.addEventListener('keydown', (event)=>{
  if(event.key==='Enter'||event.key===' '){ event.preventDefault(); tapCrystal(); }
});

/* ---------- Input handling ---------- */
const history_ = [];
let hIdx = -1;
form.addEventListener('submit', e=>{
  e.preventDefault();
  if(!booted) return;
  const raw = input.value.trim();
  input.value = '';
  print(`<span class="prompt">guest@lexagen:~$</span> ${esc(raw)}`);
  if(!raw) return;
  history_.push(raw); hIdx = history_.length;
  const key = raw.toLowerCase();
  const cmd = key === 'sudo make me rich' ? 'sudo' : key.split(' ')[0];
  if(CMDS[cmd] && (cmd!=='sudo' || key.startsWith('sudo'))) CMDS[cmd]();
  else print(`<span class="r">команда не найдена:</span> ${esc(raw)} <span class="dim">— попробуй help</span>`);
});
input.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp'){ if(hIdx>0){hIdx--; input.value=history_[hIdx]||'';} e.preventDefault(); }
  if(e.key==='ArrowDown'){ if(hIdx<history_.length-1){hIdx++; input.value=history_[hIdx]||'';} else {hIdx=history_.length; input.value='';} e.preventDefault(); }
});
document.getElementById('screen').addEventListener('click', ()=>{ if(booted) input.focus(); });

/* ---------- Matrix ---------- */
let mxRunning = false;
function startMatrix(){
  const ov = document.getElementById('matrix');
  const cv = document.getElementById('mx');
  ov.style.display = 'block';
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const chars = 'アイウエオカキクケコ01LEXAGEN2468КИМИ';
  const fs = 16, cols = Math.floor(cv.width/fs);
  const drops = Array(cols).fill(0).map(()=>Math.random()*-50);
  mxRunning = true;
  function draw(){
    if(!mxRunning) return;
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font = fs+'px monospace';
    for(let i=0;i<cols;i++){
      ctx.fillStyle = Math.random()<.06 ? '#aff' : '#0f4';
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fs, drops[i]*fs);
      if(drops[i]*fs > cv.height && Math.random()>.975) drops[i]=0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
  const stop = ()=>{ mxRunning=false; ov.style.display='none'; input.focus();
    window.removeEventListener('keydown',stop); ov.removeEventListener('click',stop); };
  setTimeout(()=>{ window.addEventListener('keydown',stop); ov.addEventListener('click',stop); },300);
}

boot();
</script>
</body>
</html>
